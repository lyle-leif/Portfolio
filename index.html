<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <style>html,body{background:#0a0a0a;margin:0}html:not(.dark),html:not(.dark) body{background:#f4f3ef}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lyle Daniel | Developer & AI Automation Engineer</title>
    <meta name="description" content="Lyle Daniel builds web apps and AI-driven workflows that take repetitive work off your team's plate." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
